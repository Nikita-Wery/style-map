apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
  namespace: stylemap

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: stylemap-vector
rules:
  - apiGroups: [""]
    resources:
      - pods
      - namespaces
      - nodes
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stylemap-vector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: stylemap-vector
subjects:
  - kind: ServiceAccount
    name: vector
    namespace: stylemap

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: stylemap
data:
  vector.yaml: |
    sources:
      kubernetes_logs:
        type: kubernetes_logs

    transforms:
      stylemap_only:
        type: filter
        inputs:
          - kubernetes_logs
        condition: '.kubernetes.pod_namespace == "stylemap"'

      parse_json:
        type: remap
        inputs:
          - stylemap_only
        source: |
          if is_string(.message) {
            parsed, err = parse_json(.message)
            if err == null {
              . = merge!(., parsed)
            }
          }
    sinks:
      victoria_logs:
        type: http
        inputs:
          - parse_json
        uri: "http://victoria-logs:9428/insert/jsonline?_stream_fields=kubernetes.pod_namespace,kubernetes.pod_name,kubernetes.container_name&_msg_field=message&_time_field=timestamp"
        compression: gzip
        encoding:
          codec: json
        framing:
          method: newline_delimited
        healthcheck:
          enabled: false

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  namespace: stylemap
spec:
  selector:
    matchLabels:
      app: vector
  template:
    metadata:
      labels:
        app: vector
    spec:
      serviceAccountName: vector

      containers:
        - name: vector
          image: timberio/vector:0.50.0-debian
          args:
            - --config
            - /etc/vector/vector.yaml
          env:
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          volumeMounts:
            - name: config
              mountPath: /etc/vector
              readOnly: true

            - name: var-log-pods
              mountPath: /var/log/pods
              readOnly: true

            - name: vector-data
              mountPath: /var/lib/vector

      volumes:
        - name: config
          configMap:
            name: vector-config

        - name: var-log-pods
          hostPath:
            path: /var/log/pods

        - name: vector-data
          hostPath:
            path: /var/lib/vector
            type: DirectoryOrCreate
