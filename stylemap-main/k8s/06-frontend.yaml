apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: stylemap
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: stylemap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: stylemap-frontend:latest
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 80

          env:
            - name: STYLEMAP_BACKEND_HOST
              value: "backend.stylemap.svc.cluster.local:8080"

            - name: STYLEMAP_DNS_RESOLVER
              value: "10.96.0.10"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
