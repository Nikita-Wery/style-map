apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: stylemap
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-svc:5432/postgres"
  APP_STORAGE_UPLOAD_DIR: "/app/uploads"
  APP_SECURITY_SUCCESS_URL: "/"
  # CORS в этой схеме не используется: браузер ходит на тот же origin,
  # а nginx проксирует /api на бэкенд. Значение важно только при прямых
  # кросс-доменных запросах к API (например, Vite dev-сервер без прокси).
  APP_SECURITY_ALLOWED_ORIGINS: "http://localhost:30080,http://localhost:5173"
  # Миграции выполняет отдельный Job (backend/liquibase-migration-job.yaml),
  # поэтому приложение их не запускает.
  SPRING_LIQUIBASE_ENABLED: "false"
