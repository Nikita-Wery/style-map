# Consumed by promtool after validate-alerting.py extracts the ConfigMap rules.
rule_files: [stylemap-alerts.yaml]
evaluation_interval: 15s
tests:
  - name: absent metrics never fire
    interval: 15s
    input_series: []
    promql_expr_test:
      - expr: ALERTS{alertstate="firing"}
        eval_time: 10m
        exp_samples: []

  - name: all five alerts respect pending and fire under sustained conditions
    interval: 15s
    input_series:
      - series: 'stylemap_outfits_publish_duration_seconds_count{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap"}'
        values: '0+2x60'
      - series: 'stylemap_outfits_publish_duration_seconds_sum{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap"}'
        values: '0+4x60'
      - series: 'http_server_requests_seconds_count{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap",status="200",uri="/auth/login"}'
        values: '0+8x60'
      - series: 'http_server_requests_seconds_count{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap",status="500",uri="UNKNOWN"}'
        values: '0+2x60'
      - series: 'jvm_gc_pause_seconds_count{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap",kubernetes_pod_name="backend-test",instance="backend:8081",gc="Copy",cause="Allocation Failure",action="end of minor GC"}'
        values: '0+1x60'
      - series: 'jvm_gc_pause_seconds_sum{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap",kubernetes_pod_name="backend-test",instance="backend:8081",gc="Copy",cause="Allocation Failure",action="end of minor GC"}'
        values: '0+0.3x60'
      - series: 'jvm_memory_used_bytes{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap",kubernetes_pod_name="backend-test",instance="backend:8081",area="heap",id="Eden Space"}'
        values: '90+0x60'
      - series: 'jvm_memory_used_bytes{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap",kubernetes_pod_name="backend-test",instance="backend:8081",area="heap",id="Survivor Space"}'
        values: '90+0x60'
      - series: 'jvm_memory_used_bytes{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap",kubernetes_pod_name="backend-test",instance="backend:8081",area="heap",id="Tenured Gen"}'
        values: '90+0x60'
      - series: 'jvm_memory_max_bytes{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap",kubernetes_pod_name="backend-test",instance="backend:8081",area="heap",id="Eden Space"}'
        values: '100+0x60'
      - series: 'jvm_memory_max_bytes{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap",kubernetes_pod_name="backend-test",instance="backend:8081",area="heap",id="Survivor Space"}'
        values: '100+0x60'
      - series: 'jvm_memory_max_bytes{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap",kubernetes_pod_name="backend-test",instance="backend:8081",area="heap",id="Tenured Gen"}'
        values: '100+0x60'
      - series: 'probe_success{job="stylemap-readiness",instance="http://backend-management.stylemap.svc.cluster.local:8081/actuator/health/readiness"}'
        values: '0+0x60'
    promql_expr_test:
      - expr: ALERTS{alertstate="firing"}
        eval_time: 30s
        exp_samples: []
      - expr: 'count(ALERTS{alertstate="pending",alertname="BackendUnavailable"})'
        eval_time: 30s
        exp_samples: [{labels: '{}', value: 1}]
      - expr: 'count(ALERTS{alertstate="firing",alertname="BackendUnavailable"})'
        eval_time: 1m
        exp_samples: [{labels: '{}', value: 1}]
      - expr: 'count by (alertname) (ALERTS{alertstate="firing"})'
        eval_time: 8m
        exp_samples:
          - {labels: '{alertname="HighPublishLatency"}', value: 1}
          - {labels: '{alertname="HighHttp5xxRate"}', value: 1}
          - {labels: '{alertname="HighJvmHeapUsage"}', value: 1}
          - {labels: '{alertname="HighGcPause"}', value: 1}
          - {labels: '{alertname="BackendUnavailable"}', value: 1}
      # All source series disappear after 15m; no synthetic success/failure is substituted.
      - expr: ALERTS{alertstate="firing"}
        eval_time: 22m
        exp_samples: []

  - name: idle counters do not divide by zero
    interval: 15s
    input_series:
      - series: 'stylemap_outfits_publish_duration_seconds_count{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap"}'
        values: '0+0x60'
      - series: 'stylemap_outfits_publish_duration_seconds_sum{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap"}'
        values: '0+0x60'
      - series: 'http_server_requests_seconds_count{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap",status="500"}'
        values: '0+0x60'
      - series: 'jvm_gc_pause_seconds_count{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap",instance="backend:8081"}'
        values: '0+0x60'
      - series: 'jvm_gc_pause_seconds_sum{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap",instance="backend:8081"}'
        values: '0+0x60'
    promql_expr_test:
      - expr: ALERTS
        eval_time: 10m
        exp_samples: []

  - name: low volume gates reject slow operations errors and GC events
    interval: 15s
    input_series:
      - series: 'stylemap_outfits_publish_duration_seconds_count{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap"}'
        values: '0+0.1x60'
      - series: 'stylemap_outfits_publish_duration_seconds_sum{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap"}'
        values: '0+0.2x60'
      - series: 'http_server_requests_seconds_count{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap",status="500"}'
        values: '0+0.4x60'
      - series: 'jvm_gc_pause_seconds_count{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap",instance="backend:8081"}'
        values: '0+0.1x60'
      - series: 'jvm_gc_pause_seconds_sum{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap",instance="backend:8081"}'
        values: '0+0.1x60'
    promql_expr_test:
      - expr: ALERTS
        eval_time: 10m
        exp_samples: []
