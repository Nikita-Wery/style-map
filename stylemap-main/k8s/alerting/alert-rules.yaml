apiVersion: v1
kind: ConfigMap
metadata:
  name: stylemap-alert-rules
  namespace: monitoring
data:
  stylemap-alerts.yaml: |
    groups:
      - name: stylemap
        interval: 15s
        rules:
          - alert: HighPublishLatency
            expr: |
              (
                sum by (app, kubernetes_namespace) (rate(stylemap_outfits_publish_duration_seconds_sum{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap"}[2m]))
                /
                (sum by (app, kubernetes_namespace) (rate(stylemap_outfits_publish_duration_seconds_count{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap"}[2m])) > 0)
              ) > 1
              and
              sum by (app, kubernetes_namespace) (increase(stylemap_outfits_publish_duration_seconds_count{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap"}[2m])) >= 5
            for: 2m
            labels:
              environment: minikube
              service: stylemap-backend
              severity: warning
            annotations:
              summary: Successful outfit publication is slow
              description: "Mean successful publication duration is {{ $value | printf \"%.2f\" }} seconds (limit 1s), with approximately five or more publications in 2m, sustained for 2m. Upload time and failed publications are excluded. Check database, storage and STYLEMAP_DEMO_PUBLISH_DELAY_MS."

          - alert: HighHttp5xxRate
            # Include UNKNOWN URI labels; management-port scrapes do not create this timer.
            expr: |
              (
                sum by (app, kubernetes_namespace) (rate(http_server_requests_seconds_count{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap",status=~"5.."}[5m]))
                /
                (sum by (app, kubernetes_namespace) (rate(http_server_requests_seconds_count{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap"}[5m])) > 0)
              ) > 0.05
              and
              sum by (app, kubernetes_namespace) (increase(http_server_requests_seconds_count{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap"}[5m])) >= 20
              and
              sum by (app, kubernetes_namespace) (increase(http_server_requests_seconds_count{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap",status=~"5.."}[5m])) >= 5
            for: 2m
            labels:
              environment: minikube
              service: stylemap-backend
              severity: critical
            annotations:
              summary: Backend HTTP server error rate is high
              description: "HTTP 5xx fraction is {{ $value | printf \"%.3f\" }} (limit 0.05), with approximately 20 requests and five server errors in 5m, sustained for 2m. Includes all backend routes; excludes errors produced only by the frontend proxy. Inspect backend logs and dependencies."

          - alert: HighJvmHeapUsage
            # Validated Serial GC pools. Refuse partial, undefined, non-finite or changed pools.
            expr: |
              (
                sum by (app, kubernetes_namespace, kubernetes_pod_name, instance) (jvm_memory_used_bytes{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap",area="heap"})
                /
                (sum by (app, kubernetes_namespace, kubernetes_pod_name, instance) (jvm_memory_max_bytes{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap",area="heap"}) > 0 < +Inf)
              ) > 0.85
              and
              count by (app, kubernetes_namespace, kubernetes_pod_name, instance) (jvm_memory_used_bytes{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap",area="heap"}) == 3
              and
              count by (app, kubernetes_namespace, kubernetes_pod_name, instance) (jvm_memory_max_bytes{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap",area="heap"}) == 3
              and
              count by (app, kubernetes_namespace, kubernetes_pod_name, instance) (
                (jvm_memory_used_bytes{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap",area="heap"} >= 0 < +Inf)
                and
                (jvm_memory_max_bytes{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap",area="heap",id=~"Eden Space|Survivor Space|Tenured Gen"} > 0 < +Inf)
              ) == 3
            for: 5m
            labels:
              environment: minikube
              service: stylemap-backend
              severity: warning
            annotations:
              summary: Backend JVM heap usage is high
              description: "Heap utilization on {{ $labels.kubernetes_pod_name }} is {{ $value | printf \"%.3f\" }} (limit 0.85), sustained for 5m. Denominator uses the three validated Serial GC heap pools. Inspect retained objects and GC activity; revalidate this rule after changing the collector."

          - alert: HighGcPause
            expr: |
              (
                sum by (app, kubernetes_namespace, kubernetes_pod_name, instance) (rate(jvm_gc_pause_seconds_sum{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap"}[5m]))
                /
                (sum by (app, kubernetes_namespace, kubernetes_pod_name, instance) (rate(jvm_gc_pause_seconds_count{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap"}[5m])) > 0)
              ) > 0.2
              and
              sum by (app, kubernetes_namespace, kubernetes_pod_name, instance) (increase(jvm_gc_pause_seconds_count{job="kubernetes-pods",app="backend",kubernetes_namespace="stylemap"}[5m])) >= 5
            for: 5m
            labels:
              environment: minikube
              service: stylemap-backend
              severity: warning
            annotations:
              summary: Backend JVM GC pauses are long
              description: "Mean GC pause on {{ $labels.kubernetes_pod_name }} is {{ $value | printf \"%.3f\" }} seconds (limit 0.2s), with approximately five or more GC events in 5m, sustained for 5m. Aggregated across GC causes and actions within this JVM; this is an event-weighted mean, not p95 or GC overhead."

          - alert: BackendUnavailable
            expr: |
              probe_success{job="stylemap-readiness",instance="http://backend-management.stylemap.svc.cluster.local:8081/actuator/health/readiness"} == 0
            for: 1m
            labels:
              app: backend
              kubernetes_namespace: stylemap
              environment: minikube
              service: stylemap-backend
              severity: critical
            annotations:
              summary: Backend readiness probe is failing
              description: "Blackbox readiness checks have failed for 1m. Check backend endpoints and PostgreSQL, which is part of readiness. A missing probe series is not treated as failure or success; inspect monitoring targets separately."
