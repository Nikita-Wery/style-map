apiVersion: v1
kind: ConfigMap
metadata:
  name: stylemap-alertmanager-config
  namespace: monitoring
data:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: email
      group_by: [environment, service, alertname, severity]
      group_wait: 15s
      group_interval: 1m
      repeat_interval: 4h
    receivers:
      - name: email
        email_configs:
          - to: nsluzin@kpfu.ru
            from: nsluzin@kpfu.ru
            smarthost: smtp.yandex.ru:587
            auth_username: nsluzin@kpfu.ru
            auth_password_file: /etc/alertmanager/smtp/password
            require_tls: true
            force_implicit_tls: false
            tls_config:
              server_name: smtp.yandex.ru
            send_resolved: true
            headers:
              Subject: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
            text: |-
              [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})
              Service: {{ .CommonLabels.service }} / {{ .CommonLabels.environment }}
              {{ range .Alerts }}
              {{ .Annotations.summary }}
              {{ .Annotations.description }}
              {{ if .Labels.kubernetes_pod_name }}Pod: {{ .Labels.kubernetes_pod_name }}{{ end }}
              {{ end }}
