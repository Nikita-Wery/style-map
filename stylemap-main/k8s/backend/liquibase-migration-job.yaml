apiVersion: batch/v1
kind: Job
metadata:
  name: liquibase-migration
  namespace: stylemap
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres-svc 5432; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: liquibase
          image: sasniykunchik/stylemap-liquibase-migrations:latest
          imagePullPolicy: IfNotPresent
          command: ["liquibase"]
          args:
            - --log-level=debug
            - --searchPath=/changesets
            - --changelog-file=db.changelog-master.xml
            - --driver=org.postgresql.Driver
            - --url=jdbc:postgresql://postgres-svc:5432/$(POSTGRES_DB)
            - --username=$(POSTGRES_USER)
            - --password=$(POSTGRES_PASSWORD)
            - update
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD