apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: stylemap
  labels:
    app: front-deploy
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app: front
  template:
    metadata:
      labels:
        app: front
    spec:
      containers:
        - name: frontend
          image: sasniykunchik/stylemap-frontend:v3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            # Адрес бэкенда для nginx. ОБЯЗАТЕЛЬНО полное (FQDN) имя:
            # nginx не применяет search-домены из /etc/resolv.conf, поэтому
            # короткое "back-service" не резолвится и все /api отдают 502.
            - name: STYLEMAP_BACKEND_HOST
              value: back-service.stylemap.svc.cluster.local:8080
            # DNS-резолвер кластера (CoreDNS). 127.0.0.11 из docker-compose здесь недоступен.
            - name: STYLEMAP_DNS_RESOLVER
              value: kube-dns.kube-system.svc.cluster.local
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: front-service
  namespace: stylemap
spec:
  type: NodePort
  selector:
    app: front
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
