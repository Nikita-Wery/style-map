<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация - StyleMap</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">

<div class="container" style="max-width: 400px; width: 100%;">
    <h2 style="text-align: center; margin-bottom: 24px;">Создать аккаунт</h2>

    <div th:if="${binding_errors}" class="box" style="border-color: var(--danger); background: #fff5f5;">
        <ul style="margin: 0; padding-left: 20px;">
            <li th:each="error : ${binding_errors}" th:text="${error}" class="error-text"></li>
        </ul>
    </div>

    <div th:if="${errors}" class="box" style="border-color: var(--danger); background: #fff5f5;">
        <label style="margin: 0; padding-left: 20px;" th:text="${errors}" class="error-text"></label>
    </div>

    <form th:action="@{/auth/register}" method="post">
        <input type="text" name="email" placeholder="Электронная почта" required />
        <input type="text" name="username" placeholder="Имя пользователя" required />
        <input type="password" name="password" placeholder="Пароль" required />
        <button type="submit" style="width: 100%; margin-top: 10px;">Зарегистрироваться</button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 14px;">
        Уже есть аккаунт? <a th:href="@{/auth/login}" style="font-weight: 600;">Войти</a>
    </div>
</div>

</body>
</html>
