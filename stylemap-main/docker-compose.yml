services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
    ports:
      - "5434:5432"
    volumes:
      - ./my_db_files:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  liquibase-migrations:
    image: liquibase/liquibase:4.29
    depends_on:
      db:
        condition: service_healthy
    command:
      - --log-level=info
      - --searchPath=/changesets
      - --changelog-file=db.changelog-master.xml
      - --driver=org.postgresql.Driver
      - --url=jdbc:postgresql://db:5432/${DB_NAME}
      - --username=${DB_USER}
      - --password=${DB_PASSWORD}
      - update
    volumes:
      - ./src/main/resources/db/changelog:/changesets:ro

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
      liquibase-migrations:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in .env}
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-true}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?Set MAIL_USERNAME in .env}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?Set MAIL_PASSWORD in .env}
      MAIL_SENDER_EMAIL: ${MAIL_SENDER_EMAIL:-${MAIL_USERNAME}}
      APP_STORAGE_UPLOAD_DIR: /app/uploads
      APP_SECURITY_SUCCESS_URL: /
      APP_SECURITY_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      SPRING_LIQUIBASE_ENABLED: "false"
      SHOW_SQL: ${SHOW_SQL:-false}
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    environment:
      STYLEMAP_BACKEND_HOST: backend:8080
      STYLEMAP_DNS_RESOLVER: 127.0.0.11
    restart: unless-stopped
